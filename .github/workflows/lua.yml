name: Lua checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax
        run: luac5.1 -p RAT_Core.lua RAT_UI.lua RAT.lua tests/core_spec.lua
      - name: Core behavior
        run: lua5.1 tests/core_spec.lua
